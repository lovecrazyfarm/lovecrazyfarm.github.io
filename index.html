<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
	<title>疯狂农场作物价格计算器 - 蛋仔派对疯狂农场作物价格计算工具</title>
	<meta name="description" content="完全免费的疯狂农场作物价格计算器. 支持作物重量, 重量占比, 突变, 果实生长耗时, 价格等计算.">

	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍇</text></svg>">

	<!--
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/alpinejs" defer></script>
	-->
	
	<script src="data.js" defer></script>
	<script src="tailwind-3.4.17.min.js"></script>
	<script src="alpine-3.17.1.min.js" defer></script>
	
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'farm-gold': '#f3b33d',
						'farm-brown': '#c97e2a',
						'farm-cream': '#fffaf0',
						'farm-leaf': '#2b3b1c',
						'farm-wheat': '#f6e2b5',
						'farm-dark': '#2d2b20',
						'farm-orange': '#e68a2e',
						'farm-sky': '#e8f4fc',
						'farm-lavender': '#e6e6fa'
					}
				}
			}
		}
	</script>

	<style>
		.scroll-content::-webkit-scrollbar { width: 5px; }
		.scroll-content::-webkit-scrollbar-track { background: #e0e8f0; border-radius: 3px; }
		.scroll-content::-webkit-scrollbar-thumb { background: #8aacc9; border-radius: 3px; }

		.tag-transition { transition: all 0.2s ease; }
		
		@keyframes twinkle {
			0%, 100% { opacity: 0.3; }
			50% { opacity: 1; }
		}
		.star {
			position: absolute;
			background: white;
			border-radius: 50%;
			animation: twinkle 2s ease-in-out infinite;
			pointer-events: none;
		}
		
		@keyframes meteor {
			0% {
				transform: translateX(0) translateY(0) rotate(135deg);
				opacity: 1;
			}
			40% {
				transform: translateX(100px) translateY(100px) rotate(135deg); /* 飞一小段就淡出 */
				opacity: 1;
			}
			100% {
				transform: translateX(300px) translateY(300px) rotate(135deg);
				opacity: 0;
			}
		}
		
		.meteor {
			position: absolute;
			width: 2px;
			height: 50px;
			background: linear-gradient(135deg, rgba(255,240,180,0.9), rgba(255,200,100,0.6), rgba(255,255,255,0));
			transform: rotate(135deg);
			animation: meteor 5s linear infinite;
			opacity: 0;
			filter: blur(0.5px);
			pointer-events: none;
			z-index: 5;
		}
		
		.text-shadow-black {
			text-shadow: -0.5px -0.5px 0 #000000, 0.5px -0.5px 0 #000000, -0.5px 0.5px 0 #000000, 0.5px 0.5px 0 #000000;
		}
		
		.content-bg {
			background: #fefef7;
		}
		
		body {
			overflow-y: auto;
			overflow-x: hidden;
		}
		
		/* 横向输入组样式 */
		.horizontal-input-group {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			flex: 0.8;
			min-width: 130px;
		}
		.horizontal-input-group label {
			white-space: nowrap;
			font-size: 0.7rem;
			font-weight: 600;
			color: #6366f1;
			margin-bottom: 0;
		}
		.horizontal-input-group input {
			flex: 1;
			min-width: 0;
			padding: 0.45rem 0.7rem;
			font-size: 0.8rem;
		}
		
		.time-input-group {
			flex: 1.2;
			min-width: 200px;
		}
		
		@media (max-width: 768px) {
			.horizontal-input-group {
				flex: 1;
				min-width: 100%;
			}
			.time-input-group {
				min-width: 100%;
			}
		}

		.floating-enter-active {
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.floating-enter-from {
			opacity: 0;
			transform: translateY(-20px);
		}
		.floating-enter-to {
			opacity: 1;
			transform: translateY(0);
		}
		.floating-leave-active {
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.floating-leave-from {
			opacity: 1;
			transform: translateY(0);
		}
		.floating-leave-to {
			opacity: 0;
			transform: translateY(-20px);
		}
		
		.price-up-effect {
				color: #fbbf24;
		}
		.price-down-effect {
				color: #f87171;
		}
		.price-normal {
				color: #6366f1;
		}
		.price-transition {
				transition: all 0.15s ease;
		}


		/* ========== 迷你像素彩虹 UFO ========== */
		/* 顶部圆顶 (3层阶梯像素) */
		.ufo-dome {
			position: absolute;
			top: 0; left: 50%;
			transform: translateX(-50%);
			width: 18px;
			height: 6px;
			background: #a78bfa;
			box-shadow: 
				-4px 6px 0 #a78bfa, 4px 6px 0 #a78bfa, /* 第二层 */
				-8px 12px 0 #8b5cf6, 8px 12px 0 #8b5cf6; /* 第三层 */
			z-index: 3;
		}
		/* 圆顶顶部高光 */
		.ufo-dome::before {
			content: '';
			position: absolute;
			top: 0; left: 4px;
			width: 10px; height: 2px;
			background: #c4b5fd;
		}
		
		/* 主碟身 (宽扁的像素椭圆) */
		.ufo-body {
			position: absolute;
			top: 12px; left: 0;
			width: 100%;
			height: 14px;
			background: #6d28d9;
			/* 像素阶梯圆角 */
			clip-path: polygon(
				10% 0, 90% 0, 
				100% 30%, 100% 70%, 
				90% 100%, 10% 100%, 
				0 70%, 0 30%
			);
			z-index: 4;
			box-shadow: inset 0 -4px 0 #4c1d95;
		}
		
		/* 彩虹灯带 (居中3个像素块) */
		.ufo-lights {
			position: absolute;
			top: 18px; left: 50%;
			transform: translateX(-50%);
			width: 28px;
			height: 2px;
			background: transparent;
			z-index: 5;
			display: flex;
			justify-content: space-between;
		}
		.ufo-lights::before,
		.ufo-lights::after,
		.ufo-lights span {
			content: '';
			display: block;
			width: 3px; height: 2px;
		}
		/* 左红，右青，中间用伪元素填黄 */
		.ufo-lights::before { background: #f87171; box-shadow: 0 0 4px #f87171; }
		.ufo-lights::after { background: #22d3ee; box-shadow: 0 0 4px #22d3ee; }
		.ufo-lights span { background: #fbbf24; box-shadow: 0 0 4px #fbbf24; }
		
		/* 底部光束 (极简像素梯形) */
		.ufo-beam {
			position: absolute;
			top: 26px; left: 50%;
			transform: translateX(-50%);
			width: 36px;
			height: 20px;
			background: rgba(167, 139, 250, 0.5);
			clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
			z-index: 2;
			animation: ufo-beam-pulse 1s steps(2) infinite;
		}
		.ufo-beam::before {
			content: '';
			position: absolute;
			inset: 0;
			background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px);
		}
		
		.mini-ufo {
			position: absolute;
			top: 10px;
			right: 20px;
			width: 60px;
			height: 40px;
			z-index: 20;
			pointer-events: none;
			/* 初始缩放在这里，大小依然可控 */
			transform-origin: top right;
			/* 随机巡游动画，时长 12 秒，平滑缓动 */
			animation: ufo-wander 12s ease-in-out infinite alternate;
		}
		
		/* 纯 CSS 的巡游飞行轨迹 */
		@keyframes ufo-wander {
			0% {
				transform: translate(0, 0) scale(0.8) rotate(0deg);
			}
			25% {
				/* 往左上方飞，微微倾斜 */
				transform: translate(-100px, -10px) scale(0.8) rotate(-5deg);
			}
			50% {
				/* 飞向中间偏左，高度略微下沉 */
				transform: translate(-200px, 15px) scale(0.8) rotate(5deg);
			}
			75% {
				/* 飞回偏右侧，高度拉起 */
				transform: translate(-80px, -5px) scale(0.8) rotate(-3deg);
			}
			100% {
				/* 回到初始位置 */
				transform: translate(0, 0) scale(0.8) rotate(0deg);
			}
		}
		
		/* 底部的光束闪烁保留，不受飞行影响 */
		@keyframes ufo-beam-pulse {
			0%, 100% { opacity: 0.4; }
			50% { opacity: 1; }
		}
	</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 font-sans antialiased overflow-y-auto overflow-x-hidden p-6">

<div x-data="farmCalculator()" x-init="init()" class="max-w-[950px] w-full mx-auto relative z-10">
	<div class="rounded-[68px] shadow-[0_25px_45px_rgba(0,0,0,0.2),0_0_0_1px_rgba(200,220,240,0.5)] overflow-hidden">
		<div class="relative overflow-hidden bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 py-5 px-7 text-center border-b border-white/20">
			<div class="absolute inset-0 overflow-hidden pointer-events-none">
				<!-- 第一波 -->
				<div class="meteor" style="top: -10%; left: 10%; animation-delay: 0s;"></div>
				<div class="meteor" style="top: -20%; left: 40%; animation-delay: 1.2s;"></div>
				<div class="meteor" style="top: -5%; left: 70%; animation-delay: 2.5s;"></div>
				<div class="meteor" style="top: -15%; left: 25%; animation-delay: 3.8s;"></div>
				
				<!-- 第二波 -->
				<div class="meteor" style="top: -25%; left: 85%; animation-delay: 0.5s;"></div>
				<div class="meteor" style="top: -10%; left: 55%; animation-delay: 1.8s;"></div>
				<div class="meteor" style="top: -30%; left: 15%; animation-delay: 3.1s;"></div>
				<div class="meteor" style="top: -8%; left: 80%; animation-delay: 4.2s;"></div>
				
				<!-- 第三波 -->
				<div class="meteor" style="top: -20%; left: 30%; animation-delay: 0.8s;"></div>
				<div class="meteor" style="top: -12%; left: 60%; animation-delay: 2.1s;"></div>
				<div class="meteor" style="top: -18%; left: 5%; animation-delay: 3.5s;"></div>
				<div class="meteor" style="top: -22%; left: 75%; animation-delay: 4.8s;"></div>
			
				<!-- 星星点缀 -->
				<div class="star" style="width: 1.5px; height: 1.5px; top: 10%; left: 8%;"></div>
				<div class="star" style="width: 2px; height: 2px; top: 20%; left: 85%;"></div>
				<div class="star" style="width: 1px; height: 1px; top: 50%; left: 50%;"></div>
				<div class="star" style="width: 1.5px; height: 1.5px; top: 70%; left: 20%;"></div>
			</div>
			
			<h2 class="text-nowrap drop-shadow-[0_2px_10px_rgba(0,0,0,0.3)] relative z-10" 
					style="font-family: sans-serif; 
								-webkit-font-smoothing: antialiased; 
								-moz-osx-font-smoothing: grayscale; 
								letter-spacing: 0.5px; 
								line-height: 1.2;
								background: linear-gradient(to bottom, 
										#dd1111,
										#ee5511,
										#ee9911,
										#ddcc11,
										#88dd22,
										#44dd44,
										#22cc66,
										#22bb99,
										#2299cc,
										#2266dd,
										#6633dd,
										#aa22dd);
								-webkit-background-clip: text;
								-webkit-text-fill-color: transparent;
								background-clip: text;
								text-shadow: none;
								filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
								font-size: clamp(1.4rem, 6vw, 2.8rem);
								font-weight: bold;
								width: 100%;
								max-width: 100%;">
				疯狂农场作物价格计算器
			</h2>
			
			<!-- 迷你像素彩虹 UFO -->
			<div class="mini-ufo">
				<div class="ufo-dome"></div>
				<div class="ufo-body"></div>
				<div class="ufo-lights"></div>
				<div class="ufo-beam"></div>
			</div>
		</div>
		
		<div class="p-6 md:p-8 content-bg">
			<div class="flex flex-wrap gap-2 mb-4">
				<button @click="openModal('changelog')" class="bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm text-indigo-700 shadow-sm hover:bg-white hover:shadow-md transition-all">更新日志</button>
				<button @click="openModal('disclaimer')" class="bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm text-indigo-700 shadow-sm hover:bg-white hover:shadow-md transition-all">免责声明</button>
				<button @click="openModal('contact')" class="bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm text-indigo-700 shadow-sm hover:bg-white hover:shadow-md transition-all">联系作者</button>
				<button @click="openModal('support')" class="bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm text-indigo-700 shadow-sm hover:bg-white hover:shadow-md transition-all">支持一下❤</button>
			</div>

			<div class="mb-6 pb-4 border-b border-blue-200">
				<div class="text-xs font-semibold uppercase tracking-wider text-indigo-500 mb-3">版本</div>
				<div class="flex flex-wrap gap-3">
					<template x-for="cat in categories" :key="cat.id">
						<button @click="selectCategory(cat.id)" :class="selectedCategory === cat.id ? 'bg-indigo-500 text-white shadow-lg scale-105' : 'bg-white/80 text-indigo-600 shadow-sm hover:bg-white'" class="px-5 py-2.5 rounded-full font-bold text-sm transition-all hover:scale-105" x-text="cat.name"></button>
					</template>
				</div>
			</div>

			<div x-show="selectedCropId === null" class="mb-6 pb-4 border-b border-blue-200">
				<div class="text-xs font-semibold uppercase tracking-wider text-indigo-500 mb-3 flex items-center justify-between">
					<span>作物</span>
				</div>

				<div class="flex flex-wrap gap-3 justify-center">
					<template x-for="crop in filteredCrops" :key="crop.id">
						<button @click="selectCrop(crop)"
								class="flex flex-col items-center w-20 p-1.5 rounded-xl transition-all hover:scale-105 hover:shadow-md bg-white/60 hover:bg-white">
							<div class="w-16 h-16 flex items-center justify-center rounded-lg overflow-hidden">
								<img :src="'img/crops/' + crop.id + '.png'"
									:alt="crop.name"
									class="w-full h-full object-contain"
									@error="$event.target.style.display='none'">
							</div>
							<span class="mt-1 text-xs font-semibold text-gray-700 text-center leading-tight"
								x-text="crop.name"></span>
						</button>
					</template>
					<div x-show="filteredCrops.length === 0" class="w-full text-center py-6 text-indigo-400 text-sm">无可选作物</div>
				</div>
			</div>

			<!-- 作物基础信息和输入 -->
			<div x-show="selectedCropId !== null" x-transition.duration.200ms><div id="priceCardPlaceholder" class="backdrop-blur-sm rounded-2xl overflow-hidden shadow-md mb-6">
				<!-- 图片 + 信息 + 输入框 -->
				<div class="p-4 pb-2 flex flex-col sm:flex-row items-center justify-center gap-4 border-b border-gray-100 order-1">
					<!-- 左：图片 -->
					<div class="w-16 h-16 flex-shrink-0 flex items-center justify-center rounded-xl overflow-hidden relative"
						:style="currentCrop ? 'background:' + currentCrop.fillColor : 'background:#e5e7eb'">
						<span class="absolute inset-0 flex items-center justify-center text-2xl font-bold text-white"
							style="text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;"
							x-text="currentCrop ? currentCrop.name.charAt(0) : '?'"></span>
						<template x-if="currentCrop">
							<img :src="'img/crops/' + currentCrop.id + '.png'"
								:alt="currentCrop.name"
								class="w-full h-full object-contain relative z-10"
								@error="$event.target.style.display='none'">
						</template>
					</div>
				
					<!-- 中：名称/价格/重量 -->
					<div class="flex-shrink-0 min-w-0 text-left">
						<div class="text-base font-bold text-gray-800 truncate" x-text="currentCrop ? currentCrop.name : '未选择作物'"></div>
						<div class="text-3xl font-extrabold text-indigo-600 leading-tight" x-text="formattedPrice"></div>
						<div class="text-sm text-gray-600">
							<span x-show="weightInput"><span x-text="displayWeight || '0'"></span> kg</span>
						</div>
					</div>
				
					<!-- 右：输入框（手机端移至底部，PC端留在右侧） -->
					<div class="flex-shrink-0 flex flex-col gap-2 w-full sm:w-44 order-4 sm:order-none mt-2 sm:mt-0">
						<!-- 重量 -->
						<div class="flex flex-col sm:flex-row sm:items-center sm:gap-1">
							<label class="text-xs font-semibold text-indigo-500 mb-0.5 text-left sm:mb-0 sm:w-10 sm:text-right">重量</label>
							<input type="text" x-model="weightInput" @input="updateFromWeight" @blur="handleWeightBlur"
								class="flex-1 min-w-0 px-2 py-1 rounded-full border border-blue-200 bg-white text-xs outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
								oninput="this.value = this.value.replace(/[^\d.]/g, '').replace(/^\./, '0.').replace(/\.{2,}/g, '.').replace(/(\..*)\./g, '$1').replace(/(\.\d{2})\d+/, '$1')"
								:placeholder="weightPlaceholder">
						</div>
						<!-- 占比 -->
						<div class="flex flex-col sm:flex-row sm:items-center sm:gap-1">
							<label class="text-xs font-semibold text-indigo-500 mb-0.5 text-left sm:mb-0 sm:w-10 sm:text-right">占比</label>
							<input type="text" x-model="percentInput" @input="updateFromPercent" @blur="handlePercentBlur"
								class="flex-1 min-w-0 px-2 py-1 rounded-full border border-blue-200 bg-white text-xs outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
								oninput="this.value = this.value.replace(/[^\d.]/g, '').replace(/^\./, '0.').replace(/\.{2,}/g, '.').replace(/(\..*)\./g, '$1').replace(/(\.\d{2})\d+/, '$1')"
								:placeholder="percentPlaceholder">
						</div>
						<!-- 时间 -->
						<div class="flex flex-col sm:flex-row sm:items-center sm:gap-1">
							<label class="text-xs font-semibold text-indigo-500 mb-0.5 text-left sm:mb-0 sm:w-10 sm:text-right">时间</label>
							<input type="text" x-model="timeInput" @input="updateFromTime" @blur="handleTimeBlur"
								class="flex-1 min-w-0 px-2 py-1 rounded-full border border-blue-200 bg-white text-xs outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
								oninput="this.value = this.value.replace(/[^\d.]/g, '').replace(/^\./, '0.').replace(/\.{2,}/g, '.').replace(/(\..*)\./g, '$1').replace(/(\.\d{2})\d+/, '$1')"
								placeholder="+1%的秒数(无加速)">
						</div>
					</div>
				</div>
				
				<!-- 时间提示 / 输入引导 -->
				<div class="px-4 pb-3 text-center border-b border-gray-100 order-2 sm:order-none" x-show="currentCrop">
					<!-- 有输入时显示时间 -->
					<div x-show="weightInput">
						<span class="text-sm text-gray-600">
							从0%开始，约 <span class="text-indigo-600 font-bold" x-text="maturityTimeDisplay"></span> 内成熟
						</span>
					</div>
					<!-- 没输入时显示警告提示 -->
					<div x-show="!weightInput" class="inline-flex items-center gap-1.5 px-3 py-1 bg-amber-50 text-amber-600 border border-amber-200 rounded-full text-sm font-medium">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
						</svg>
						<span>当前没有数据，请输入重量/占比/时间</span>
					</div>
				</div>
				
				<!-- 已选突变 -->
				<div x-show="selectedTags.length > 0" class="px-4 pt-3 pb-3 order-3 sm:order-none">
					<div class="flex flex-wrap gap-2 justify-center">
						<template x-for="tag in selectedTags" :key="tag.id">
							<div @click="toggleTag(tag.id)" class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-md tag-transition" :style="`background: ${tag.fillColor}; color: white; text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;`"><span x-text="tag.name"></span></div>
						</template>

					<div class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2 flex items-center justify-center gap-2">
						<span class="text-gray-700">(共</span>
						<span class="text-gray-700 font-bold text-sm" x-text="selectedTags.length"></span>
						<span class="text-xs font-normal text-gray-700">个突变，点击取消)</span>
					</div>
				</div>
			</div>

			<!-- 已选突变, 浮动的 -->
			<div x-show="selectedCropId !== null && isPriceFloating" 
					x-transition:enter.duration.400ms.opacity.scale
					x-transition:leave.duration.300ms.opacity.scale
					@click="scrollToPriceCard()"
					class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md shadow-xl border-b-2 border-indigo-300"
					style="display: none;">
				<div class="max-w-[950px] mx-auto px-4 py-2.5">
					<div class="flex items-center justify-between">
						<span class="text-sm font-bold text-gray-700" x-text="currentCrop?.name || ''"></span>
						<span x-show="selectedTags.length > 0" class="text-xs text-gray-500">
							<span x-text="selectedTags.length"></span> 个突变
						</span>
						<span class="text-xs text-gray-500" x-show="weightInput">
							<span x-text="displayWeight || '0'"></span>kg
						</span>

						<span class="text-2xl font-extrabold text-indigo-600" x-text="formattedPrice"></span>
						<span x-show="priceChange === 'up'" class="text-base font-bold text-emerald-500 ml-0.5">▲</span>
						<span x-show="priceChange === 'down'" class="text-base font-bold text-rose-500 ml-0.5">▼</span>
					</div>
				</div>
			</div>

			<!-- 可选突变 -->
			<div x-show="selectedCropId !== null" x-transition.duration.200ms class="mb-6 pb-4 border-b border-blue-200">
				<div id="unselectedTagsContainer" class="space-y-4"></div>
			</div>
		</div>
	</div>

		<div class="relative overflow-hidden bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 py-3 px-7 text-center rounded-b-[68px] w-full max-w-full">

	<div x-show="modalOpen" style="display: none;"  @click.away="modalOpen = false" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm" x-transition.opacity.duration.200ms>

<script>
// ==================== Alpine.js 组件 ====================
function farmCalculator() {
	return {
		categories: categories,
		selectedCategory: 'cat_putong',
		selectedCropId: null,
		currentCrop: null,
		weightInput: '',
		percentInput: '',
		timeInput: '',
		checkedTags: new Map(),
		modalOpen: false,
		modalTitle: '',
		modalContent: '',
		focusMode: false,
		isPriceFloating: false,
		observer: null,
		_isScrollingBack: false,
		priceChange: 'none',
		lastPrice: 0,
		_clearTimer: null,
		quickSelectMax: false, // 一键优选默认不勾选


		get minWeight() {
			if (!this.currentCrop) return 0;
			return this.currentCrop.maxWeight / 34;
		},


		getAllTags() {
			if (!this.currentCrop) return [];
			const tagIds = this.getUniqueTagIds(this.currentCrop);
			return tagIds.map(id => tagLibrary[id]).filter(t => t);
		},


		get selectedTags() {
			const allTags = this.getAllTags();
			const selected = allTags.filter(tag => this.checkedTags.get(tag.id) === true);
			return selected.sort((a, b) => {
				if (a.priority !== b.priority) return a.priority - b.priority;
				return b.times - a.times;
			});
		},


		get unselectedTagsByLevel() {
			const allTags = this.getAllTags();
			const allLevel0 = allTags.filter(t => t.level === 0);
			const unselected = allTags.filter(tag => this.checkedTags.get(tag.id) !== true);
			const sortFn = (a, b) => {
				if (a.priority !== b.priority) return a.priority - b.priority;
				return b.times - a.times;
			};
			const unselectedLevel0 = unselected.filter(t => t.level === 0).sort(sortFn);
			
			const level0 = unselectedLevel0.length === allLevel0.length ? unselectedLevel0 : [];
			const level1 = unselected.filter(t => t.level === 1).sort(sortFn);
			const level2 = unselected.filter(t => t.level === 2).sort(sortFn);
			return { level0, level1, level2 };
		},


		get filteredCrops() {
			let crops = itemsData.filter(c => c.categories.includes(this.selectedCategory));
			if (this.focusMode && this.selectedCropId) {
				crops = crops.filter(c => c.id === this.selectedCropId);
			}
			return crops.sort((b, a) => (a.priority || 999) - (b.priority || 999));
		},


		get formattedPrice() {
			const total = this.computeTotalValue();
			if (total >= 100000000) return (total / 100000000).toFixed(2) + '亿';
			if (total >= 10000) return (total / 10000).toFixed(2) + '万';
			return total.toFixed(0);
		},


		get maturityTimeDisplay() {
			if (!this.currentCrop) return '';
			if (this.currentCrop.growthSpeed == 0) {
				return '(!未做此果实的成熟进度处理!)';
			}
			// 获取有效重量（不超过最大值）
			let weight = parseFloat(this.weightInput);
			if (isNaN(weight) || weight <= 0) return '';
			const maxWeight = this.currentCrop.maxWeight;
			let effectiveWeight = Math.min(weight, maxWeight);
			const totalSeconds = effectiveWeight * this.currentCrop.growthSpeed;
			return this.formatTime(totalSeconds);
		},


		get weightPlaceholder() {
			if (!this.currentCrop) return '';
			const minW = this.minWeight.toFixed(2);
			const maxW = this.currentCrop.maxWeight.toFixed(2);
			return `${minW} ~ ${maxW} kg`;
		},


		get percentPlaceholder() {
			if (!this.currentCrop) return '';
			const minP = Math.ceil(((this.minWeight / this.currentCrop.maxWeight) * 100));
			return `${minP}% ~ 100%`;
		},


		get displayWeight() {
			if (!this.currentCrop) return '0';
			let weight = parseFloat(this.weightInput);
			if (isNaN(weight) || weight <= 0) return '0';
			const maxWeight = this.currentCrop.maxWeight;
			return Math.min(weight, maxWeight).toFixed(2);
		},


		formatTime(seconds) {
			if (seconds < 60) {
				return `${seconds.toFixed(1)}秒`;
			} else if (seconds < 3600) {
				const minutes = Math.floor(seconds / 60);
				return `${minutes}分钟`;
			} else {
				const hours = Math.floor(seconds / 3600);
				const remainMinutes = Math.floor((seconds % 3600) / 60);
				if (remainMinutes === 0) {
					return `${hours}小时`;
				}
				return `${hours}小时 ${remainMinutes}分钟`;
			}
		},


		init() {
			this.renderUnselectedTags();
			this.setupIntersectionObserver();
		},
		
		
		scrollToPriceCard() {
			const placeholder = document.getElementById('priceCardPlaceholder');
			if (!placeholder) return;
			
			this._isScrollingBack = true;
			this.isPriceFloating = false;
			
			placeholder.scrollIntoView({ 
				behavior: 'smooth', 
				block: 'start',
				inline: 'nearest'
			});
			
			setTimeout(() => {
				this._isScrollingBack = false;
				requestAnimationFrame(() => {
					const rect = placeholder.getBoundingClientRect();
					this.isPriceFloating = rect.top < 0 || rect.bottom < 0;
				});
			}, 800);
		},
		
		
		recordPriceChange() {
			const currentPrice = this.computeTotalValue();
			if (this.lastPrice === 0) {
				this.priceChange = 'none';
			} else if (currentPrice > this.lastPrice) {
				this.priceChange = 'up';
			} else if (currentPrice < this.lastPrice) {
				this.priceChange = 'down';
			} else {
				this.priceChange = 'none';
			}
			this.lastPrice = currentPrice;
			
			clearTimeout(this._clearTimer);
			this._clearTimer = setTimeout(() => {
				this.priceChange = 'none';
			}, 1000);
		},
		
		
		setupIntersectionObserver() {
			this.$nextTick(() => {
				const placeholder = document.getElementById('priceCardPlaceholder');
				if (!placeholder) return;
				
				if (this._scrollHandler) {
					window.removeEventListener('scroll', this._scrollHandler);
				}
				
				let ticking = false;
				
				this._scrollHandler = () => {
					if (this._isScrollingBack) return;
					
					if (!ticking) {
						ticking = true;
						requestAnimationFrame(() => {
							const rect = placeholder.getBoundingClientRect();
							this.isPriceFloating = rect.top < 0 || rect.bottom < 0;
							ticking = false;
						});
					}
				};
				
				window.addEventListener('scroll', this._scrollHandler);
				this._scrollHandler();
			});
		},


		selectCategory(catId) {
			this.selectedCategory = catId;
			this.selectedCropId = null;
			this.currentCrop = null;
			this.focusMode = false;
			this.clearAllInputs();
			this.checkedTags.clear();
			this.renderUnselectedTags();
		},


		selectCrop(crop) {
			if (this.selectedCropId === crop.id) {
				this.selectedCropId = null;
				this.currentCrop = null;
				this.focusMode = false;
				this.clearAllInputs();
				this.checkedTags.clear();
				this.lastPrice = 0;
				this.priceChange = 'none';
			} else {
				this.selectedCropId = crop.id;
				this.currentCrop = crop;
				this.focusMode = true;
				this.clearAllInputs();
				this.initCheckedTags();
				this.lastPrice = 0;
				this.priceChange = 'none';
				this.$nextTick(() => {
					this.setupIntersectionObserver();
				});
			}
			this.isPriceFloating = false;
			this.renderUnselectedTags();
		},


		clearAllInputs() {
			this.weightInput = '';
			this.percentInput = '';
			this.timeInput = '';
			this.isPriceFloating = false;
		},


		initCheckedTags() {
			this.checkedTags.clear();
			if (!this.currentCrop) return;
			const tags = this.getUniqueTagIds(this.currentCrop);
			tags.forEach(tid => this.checkedTags.set(tid, false));
		},


		getUniqueTagIds(item) {
			if (!item || !item.tagGroups) return [];
			const tagIdSet = new Set();
			for (const groupKey of item.tagGroups) {
				const group = tagGroups[groupKey];
				if (group && group.tags) {
					group.tags.forEach(tid => tagIdSet.add(tid));
				}
			}
			return Array.from(tagIdSet);
		},


		updateFromWeight() {
			if (!this.currentCrop) return;
			let val = parseFloat(this.weightInput);
			if (isNaN(val)) return;
			
			const minW = this.minWeight;
			const maxW = this.currentCrop.maxWeight;
			
			if (val < minW || val > maxW) return;
			
			this.percentInput = ((val / maxW) * 100).toFixed(1);
			this.updateTimeFromWeight(val);
			this.recordPriceChange();
		},


		updateFromPercent() {
			if (!this.currentCrop) return;
			let pct = parseFloat(this.percentInput);
			if (isNaN(pct)) return;
			
			const minP = (this.minWeight / this.currentCrop.maxWeight) * 100;
			if (pct < minP || pct > 100) return;
			
			const weight = (pct / 100) * this.currentCrop.maxWeight;
			this.weightInput = weight.toFixed(2);
			this.updateTimeFromWeight(weight);
		},


		updateFromTime() {
			if (!this.currentCrop) return;
			let time = parseFloat(this.timeInput);
			if (isNaN(time)) return;

			const weight = (time * 100) / this.currentCrop.growthSpeed;
			const minW = this.minWeight;
			const maxW = this.currentCrop.maxWeight;
			
			if (weight >= minW && weight <= maxW) {
				this.updateFromWeightInput(weight);
			}
		},


		updateFromWeightInput(weight) {
			const maxW = this.currentCrop.maxWeight;
			this.weightInput = weight.toFixed(2);
			this.percentInput = ((weight / maxW) * 100).toFixed(1);
			this.recordPriceChange();
		},


		updateTimeFromWeight(weight) {
			const time = (weight * this.currentCrop.growthSpeed) / 100;
			this.timeInput = time.toFixed(2);
		},


		handleWeightBlur() {
			if (!this.currentCrop) return;
			let val = parseFloat(this.weightInput);
			if (isNaN(val)) return;
			
			const maxW = this.currentCrop.maxWeight;
			const minW = this.minWeight;
			
			if (val > maxW) {
				this.weightInput = maxW.toFixed(2);
				this.updateFromWeight();
			} else if (val < minW) {
				this.weightInput = minW.toFixed(2);
				this.updateFromWeight();
			}
		},


		handlePercentBlur() {
			if (!this.currentCrop) return;
			let pct = parseFloat(this.percentInput);
			if (isNaN(pct)) return;
			
			const minP = (this.minWeight / this.currentCrop.maxWeight) * 100;
			
			if (pct < minP) {
				this.percentInput = Math.ceil(minP);
				this.updateFromPercent();
			} else if (pct > 100) {
				this.percentInput = 100;
				this.updateFromPercent();
			}
		},


		handleTimeBlur() {
			if (!this.currentCrop) return;
			let time = parseFloat(this.timeInput);
			if (isNaN(time)) {
				this.timeInput = '';
				return;
			}
			
			this.timeInput = time.toFixed(2);
			
			if (time < 0) {
				time = 0;
				this.timeInput = '0';
			}
			
			const weight = (time * 100) / this.currentCrop.growthSpeed;
			const minW = this.minWeight;
			const maxW = this.currentCrop.maxWeight;
			
			if (weight < minW) {
				const minTime = (minW * this.currentCrop.growthSpeed) / 100;
				this.timeInput = minTime.toFixed(2);
				time = minTime;
			} else if (weight > maxW) {
				const maxTime = (maxW * this.currentCrop.growthSpeed) / 100;
				this.timeInput = maxTime.toFixed(2);
				time = maxTime;
			}

			const finalWeight = (time * 100) / this.currentCrop.growthSpeed;
			this.updateFromWeightInput(finalWeight);
		},


		computeTotalValue() {
			if (!this.currentCrop) return 0;
			let weight = parseFloat(this.weightInput);
			if (isNaN(weight) || weight <= 0) return 0;
			
			// 获取最大重量限制
			const maxWeight = this.currentCrop.maxWeight;
			// 计算时使用限制后的重量（不超过最大值）
			let effectiveWeight = Math.min(weight, maxWeight);
			
			let base = this.currentCrop.basePrice;
			let weightPower = Math.pow(effectiveWeight, 1.5);
			let level0Multi = 1.0, level1Multi = 1.0, sumLevel2 = 0.0;
			const tags = this.getUniqueTagIds(this.currentCrop);
			for (let tagId of tags) {
				if (this.checkedTags.get(tagId) === true) {
					const tag = tagLibrary[tagId];
					if (tag) {
						if (tag.level === 0) level0Multi *= tag.times;
						else if (tag.level === 1) level1Multi *= tag.times;
						else if (tag.level === 2) sumLevel2 += tag.times;
					}
				}
			}
			return base * weightPower * level0Multi * level1Multi * (1 + sumLevel2);
		},

		toggleTag(tagId) {
			const isChecked = this.checkedTags.get(tagId) === true;
			const newMap = new Map(this.checkedTags);
			
			if (!isChecked) {
				// ========== 选中逻辑 ==========
				
				// 1. 检查该突变是否被某个合成突变消耗
				let consumedBy = null;
				for (const [compositeId, def] of Object.entries(tagLibrary)) {
					if (def.synDel && def.synDel.includes(tagId) && newMap.get(compositeId) === true) {
						consumedBy = { compositeId, def };
						break;
					}
				}
				
				if (consumedBy) {
					// 被合成突变消耗了
					const { compositeId, def } = consumedBy;
					const keepList = def.synKeep || [];
					
					if (keepList.includes(tagId)) {
						// 在 synKeep 中：允许和合成突变共存
						newMap.set(tagId, true);
					} else {
						// 不在 synKeep 中：退掉合成，选中该子突变
						newMap.set(compositeId, false);
						newMap.set(tagId, true);
					}
				} else {
					// 正常情况下选中
					newMap.set(tagId, true);
				}
				
				// 2. 处理互斥组
				for (const group of exclusiveGroups) {
					if (group.tags.includes(tagId)) {
						group.tags.forEach(otherId => {
							if (otherId !== tagId && newMap.get(otherId) === true) {
								newMap.set(otherId, false);
							}
						});
					}
				}
				
				// 3. 检查是否触发新的合成
				const newlySynthesized = [];
				let changed = true;
				let loop = 0;
				while (changed && loop++ < 10) {
					changed = false;
					for (const [compositeId, def] of Object.entries(tagLibrary)) {
						if (!def.synthesis || def.synthesis.length === 0) continue;
						if (newMap.get(compositeId) === true) continue;
						
						const allChildrenChecked = def.synthesis.every(child => newMap.get(child) === true);
						if (allChildrenChecked) {
							newMap.set(compositeId, true);
							newlySynthesized.push({ compositeId, def });
							changed = true;
						}
					}
				}
				
				// 4. 新合成的突变：取消其所有 synDel 中的子突变（包括 synKeep）
				for (const { def } of newlySynthesized) {
					if (def.synDel) {
						for (const sub of def.synDel) {
							if (newMap.get(sub) === true) {
								newMap.set(sub, false);
							}
						}
					}
				}
				
				// 5. 如果选中的突变本身是合成突变，取消它的 synDel 中的子突变
				const selectedTag = tagLibrary[tagId];
				if (selectedTag && selectedTag.synDel && selectedTag.synDel.length > 0) {
					for (const sub of selectedTag.synDel) {
						if (newMap.get(sub) === true) {
							newMap.set(sub, false);
						}
					}
				}
				
			} else {
				// ========== 取消选中逻辑 ==========
				newMap.set(tagId, false);
				
				for (const [compositeId, def] of Object.entries(tagLibrary)) {
					if (def.synthesis && def.synthesis.includes(tagId)) {
						if (newMap.get(compositeId) === true) {
							const stillAllChecked = def.synthesis.every(child => newMap.get(child) === true);
							if (!stillAllChecked) {
								newMap.set(compositeId, false);
							}
						}
					}
				}
			}
			
			this.checkedTags = newMap;
			this.renderUnselectedTags();
			this.recordPriceChange();
			this.$nextTick(() => {
				this.setupIntersectionObserver();
			});
		},

		renderUnselectedTags() {
			const container = document.getElementById('unselectedTagsContainer');
			if (!this.currentCrop) {
				container.innerHTML = '<div class="text-indigo-400 text-sm py-4 text-center">未选择作物</div>';
				return;
			}
			
			const { level0, level1, level2 } = this.unselectedTagsByLevel;
			
			// 获取活动突变
			const activityTagIds = tagGroups['group_activity']?.tags || [];
			
			// 从 level2 中分离出活动突变
			const activityTags = level2.filter(tag => activityTagIds.includes(tag.id));
			const normalLevel2 = level2.filter(tag => !activityTagIds.includes(tag.id));
			
			const renderGroup = (tags, title, showQuickSelect = false) => {
				if (tags.length === 0) return '';
				
				let titleHtml = `<div class="text-xs font-semibold text-indigo-500 mb-2 pl-1 border-l-3 border-indigo-300 flex items-center gap-2 flex-wrap">`;
				titleHtml += `<span>${title}</span>`;
				if (showQuickSelect) {
					titleHtml += `
						<button @click="quickSelectLevel2()" class="px-2 py-0.5 text-xs bg-indigo-500 text-white rounded-full hover:bg-indigo-600 transition-colors">一键优选</button>
						<label class="flex items-center gap-1 text-xs text-indigo-500 cursor-pointer">
							<input type="checkbox" x-model="quickSelectMax" class="w-3.5 h-3.5 text-indigo-500 rounded border-indigo-300 focus:ring-indigo-400 cursor-pointer">
							<span>拉满</span>
						</label>
					`;
				}
				titleHtml += `</div>`;
				
				let html = titleHtml;
				html += `<div class="flex flex-wrap gap-2">`;
				for (let tag of tags) {
					html += `<div @click="toggleTag('${tag.id}')" 
					class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-md" 
					style="
						background: ${tag.fillColor}; 
						background-clip: padding-box;
						border: 2px solid rgba(255,255,255,0.3);
						color: white; 
						text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;
					">${tag.name}</div>`;
				}
				html += `</div>`;
				return html;
			};
			
			let html  = renderGroup(level0, '基础突变', false);
			html     += renderGroup(level1, '专属突变', false);
			html     += renderGroup(normalLevel2, '常规突变', true);
			if (activityTags.length > 0) {
				html += renderGroup(activityTags, '活动突变', false);
			}
			
			container.innerHTML = html || '<div class="text-indigo-400 text-sm py-4 text-center">暂无可用突变</div>';

				container.querySelectorAll('[x-on\\:click]').forEach(el => {
					const handler = el.getAttribute('x-on:click');
					el.removeAttribute('x-on:click');
					el.setAttribute('@click', handler);
				});
			});

		quickSelectLevel2() {
			const allTags = this.getAllTags();
			const level2Tags = allTags.filter(t => t.level === 2);
			const activityTagIds = tagGroups['group_activity']?.tags || [];
		
			// 先清空所有常规突变（排除活动突变）
			level2Tags.forEach(tag => {
				if (!activityTagIds.includes(tag.id)) {
					this.checkedTags.set(tag.id, false);
				}
			});
		
			if (this.quickSelectMax) {
				// ========== 拉满模式 ==========
				
				// 1. 全选所有非活动突变（排除幻彩和异彩）
				level2Tags.forEach(tag => {
					if (!activityTagIds.includes(tag.id) && tag.id !== 'huancai2' && tag.id !== 'yicai2') {
						this.checkedTags.set(tag.id, true);
					}
				});
				
				// 2. 处理互斥组：每个互斥组只保留倍数最高的
				for (const group of exclusiveGroups) {
					const groupTags = group.tags.filter(id => {
						const tag = tagLibrary[id];
						return tag && tag.level === 2 && !activityTagIds.includes(id);
					});
					
					if (groupTags.length === 0) continue;
					
					let bestId = null;
					let bestTimes = -1;
					for (const id of groupTags) {
						const times = tagLibrary[id]?.times || 0;
						if (times > bestTimes) {
							bestTimes = times;
							bestId = id;
						}
					}
					
					if (bestId === null) continue;
					for (const id of groupTags) {
						if (id !== bestId) this.checkedTags.set(id, false);
					}
				}
				
				// 3. 处理合成关系：触发所有可合成的父突变（避开互斥）
				let changed = true;
				let loop = 0;
				while (changed && loop++ < 10) {
					changed = false;
					for (const [compositeId, def] of Object.entries(tagLibrary)) {
						if (!def.synthesis || def.synthesis.length === 0) continue;
						if (this.checkedTags.get(compositeId) === true) continue;
						
						// 检查是否与已选中的互斥突变冲突
						let conflict = false;
						for (const group of exclusiveGroups) {
							if (group.tags.includes(compositeId)) {
								for (const otherId of group.tags) {
									if (otherId !== compositeId && this.checkedTags.get(otherId) === true) {
										conflict = true;
										break;
									}
								}
							}
							if (conflict) break;
						}
						if (conflict) continue;
						
						const allChildrenChecked = def.synthesis.every(child => this.checkedTags.get(child) === true);
						if (allChildrenChecked) {
							this.checkedTags.set(compositeId, true);
							changed = true;
						}
					}
				}
				
				// 4. 宽松处理被消耗的子突变：synKeep 并集优先
				const allSynDel = new Set();
				const allSynKeep = new Set();
		
				for (const [compositeId, def] of Object.entries(tagLibrary)) {
					if (!def.synDel || def.synDel.length === 0) continue;
					if (this.checkedTags.get(compositeId) !== true) continue;
					
					const keepList = def.synKeep || [];
					for (const sub of def.synDel) {
						allSynDel.add(sub);
						if (keepList.includes(sub)) {
							allSynKeep.add(sub);
						}
					}
				}
		
				for (const sub of allSynDel) {
					if (allSynKeep.has(sub)) continue;
					if (this.checkedTags.get(sub) === true) {
						this.checkedTags.set(sub, false);
					}
				}
				
			} else {
				// ========== 自定义模式 ==========
				const customTags = [
					'chengzuan2', 'cihua2', 'caihong2', 'yingguang2', 'luolei2',
					'bingdong2', 'zhanli2', 'fuxue2', 'chaoshi2', 'miwu2',
				];
				
				customTags.forEach(id => {
					if (!activityTagIds.includes(id) && this.checkedTags.has(id)) {
						this.checkedTags.set(id, true);
					}
				});
				
				// 处理互斥组
				for (const group of exclusiveGroups) {
					const groupTags = group.tags.filter(id => {
						const tag = tagLibrary[id];
						return tag && tag.level === 2 && !activityTagIds.includes(id);
					});
					
					if (groupTags.length === 0) continue;
					
					let bestId = null;
					let bestTimes = -1;
					for (const id of groupTags) {
						if (!this.checkedTags.get(id)) continue;
						const times = tagLibrary[id]?.times || 0;
						if (times > bestTimes) {
							bestTimes = times;
							bestId = id;
						}
					}
					
					if (bestId === null) continue;
					for (const id of groupTags) {
						if (id !== bestId) this.checkedTags.set(id, false);
					}
				}
				
				// 处理合成关系（避开互斥）
				let changed = true;
				let loop = 0;
				while (changed && loop++ < 10) {
					changed = false;
					for (const [compositeId, def] of Object.entries(tagLibrary)) {
						if (!def.synthesis || def.synthesis.length === 0) continue;
						if (this.checkedTags.get(compositeId) === true) continue;
						
						// 检查是否与已选中的互斥突变冲突
						let conflict = false;
						for (const group of exclusiveGroups) {
							if (group.tags.includes(compositeId)) {
								for (const otherId of group.tags) {
									if (otherId !== compositeId && this.checkedTags.get(otherId) === true) {
										conflict = true;
										break;
									}
								}
							}
							if (conflict) break;
						}
						if (conflict) continue;
						
						const allChildrenChecked = def.synthesis.every(child => this.checkedTags.get(child) === true);
						if (allChildrenChecked) {
							this.checkedTags.set(compositeId, true);
							changed = true;
						}
					}
				}
				
				// 宽松处理被消耗的子突变：synKeep 并集优先
				const allSynDel = new Set();
				const allSynKeep = new Set();
		
				for (const [compositeId, def] of Object.entries(tagLibrary)) {
					if (!def.synDel || def.synDel.length === 0) continue;
					if (this.checkedTags.get(compositeId) !== true) continue;
					
					const keepList = def.synKeep || [];
					for (const sub of def.synDel) {
						allSynDel.add(sub);
						if (keepList.includes(sub)) {
							allSynKeep.add(sub);
						}
					}
				}
		
				for (const sub of allSynDel) {
					if (allSynKeep.has(sub)) continue;
					if (this.checkedTags.get(sub) === true) {
						this.checkedTags.set(sub, false);
					}
				}
			}
		
			this.renderUnselectedTags();
			this.recordPriceChange();
		},
